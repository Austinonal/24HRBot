name: Build OpenMausBot Native Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-openmausbot-android.yml"
      - "mobile/**"
      - "docs/MOBILE_LIMITATIONS.md"

permissions:
  contents: read

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout this integration repository
        uses: actions/checkout@v4

      # The native client is currently an independent community draft PR,
      # not merged into the OpenMausBot upstream main branch. Pin the exact
      # source commit so this workflow is reproducible and reviewable.
      - name: Checkout pinned native Android client source
        uses: actions/checkout@v4
        with:
          repository: johnson020202/OpenMausBot
          ref: 2fd3645c912422be6d1ffdc0d650239a96180cbc
          path: native-client-source
          fetch-depth: 1
          sparse-checkout: apps/android
          sparse-checkout-cone-mode: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build and run unit tests
        working-directory: native-client-source/apps/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Copy APK
        run: |
          mkdir -p dist
          cp native-client-source/apps/android/app/build/outputs/apk/debug/app-debug.apk dist/OpenMausBot-Native-Android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMausBot-Native-Android-debug
          path: dist/OpenMausBot-Native-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
